<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Page — Benjamin Franklin's Six Time Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #2b211a;
  --desk-dark: #17110d;
  --paper: #e9dcbd;
  --paper2: #dfce9f;
  --ink: #1d1812;
  --faint: #7a6648;
  --faint-line: rgba(122, 102, 72, 0.35);
  --seal: #8c2b22;
  --seal-soft: rgba(140, 43, 34, 0.12);
  --pen-ink: #1f2a4a;
  --now: rgba(140, 43, 34, 0.14);
  --drop-target: rgba(140, 43, 34, 0.18);
  --card-bg: rgba(246, 237, 214, 0.72);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--desk);
  color: var(--ink);
  font-family: "EB Garamond", Georgia, serif;
  font-size: 19px;
  line-height: 1.45;
  padding: 24px 14px 60px;
}

/* Aged Parchment Page with Historical Texture */
.page {
  max-width: 1060px;
  margin: 0 auto;
  background:
    radial-gradient(ellipse at 12% 7%, rgba(160, 115, 45, 0.24), transparent 45%),
    radial-gradient(ellipse at 92% 65%, rgba(130, 85, 30, 0.22), transparent 50%),
    radial-gradient(ellipse at 45% 95%, rgba(100, 65, 20, 0.32), transparent 45%),
    radial-gradient(ellipse at 75% 15%, rgba(170, 125, 55, 0.15), transparent 40%),
    var(--paper);
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65), inset 0 0 85px rgba(85, 55, 18, 0.38);
  padding: 34px 32px 44px;
  border-radius: 4px;
  position: relative;
  border: 1px solid rgba(100, 70, 25, 0.3);
}

.page::after {
  content: "";
  position: absolute;
  top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 1px solid rgba(122, 102, 72, 0.25);
  pointer-events: none;
}

.hand {
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: 25px;
  color: var(--pen-ink);
  font-weight: 500;
}

h1, h2, h3, .q {
  font-family: "IM Fell English", "EB Garamond", Georgia, serif;
  font-weight: 400;
  margin: 0;
}

/* Header */
.head {
  text-align: center;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 16px;
  margin-bottom: 24px;
  position: relative;
}
.head-ornament {
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--faint);
  margin-bottom: 4px;
}
.head h1 {
  font-size: 34px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.head .subtitle {
  margin: 6px 0 0;
  font-style: italic;
  font-size: 18px;
  color: var(--faint);
}
.head .saying {
  margin: 8px 0 0;
  font-family: "IM Fell English", serif;
  font-style: italic;
  font-size: 19px;
  color: var(--ink);
  border-top: 1px dashed var(--faint-line);
  padding-top: 8px;
  max-width: 740px;
  margin-left: auto;
  margin-right: auto;
}

/* Two-column Journal Layout */
.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
@media (min-width: 880px) {
  .layout {
    grid-template-columns: 310px 1fr;
    gap: 34px;
    align-items: start;
  }
}

/* Left Column: Questions & Quill Scratchpad */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.card-box {
  background: var(--card-bg);
  border: 1px solid var(--faint-line);
  padding: 18px 16px;
  border-radius: 3px;
  box-shadow: inset 0 0 20px rgba(120, 80, 30, 0.08);
  position: relative;
}

.sidebar h2.q {
  font-size: 21px;
  line-height: 1.25;
  color: var(--ink);
  margin-bottom: 8px;
}
.q-sub {
  font-size: 14px;
  font-style: italic;
  color: var(--faint);
  margin-top: -4px;
  margin-bottom: 8px;
}

.ans {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--faint);
  resize: vertical;
  padding: 6px 0;
  font-family: "Caveat", cursive;
  font-size: 23px;
  color: var(--pen-ink);
  line-height: 1.35;
}
.ans:focus {
  outline: none;
  border-bottom: 2px solid var(--seal);
}
.ans::placeholder {
  color: #9b8a6a;
  font-style: italic;
}
.ans:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* Quill Scratchpad / Tasks To Slot In */
.scratchpad {
  border: 1px dashed var(--faint);
  background: rgba(255, 255, 255, 0.18);
  padding: 16px 14px;
}
.scratchpad-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.scratchpad-header h3 {
  font-family: "IM Fell English", serif;
  font-size: 19px;
  color: var(--ink);
  margin: 0;
}
.scratchpad-hint {
  font-size: 13px;
  font-style: italic;
  color: var(--faint);
}

.scratch-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.scratch-input {
  flex: 1;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--ink);
  font-family: "Caveat", cursive;
  font-size: 21px;
  color: var(--pen-ink);
  padding: 4px 2px;
}
.scratch-input:focus {
  outline: none;
  border-bottom: 2px solid var(--seal);
}
.quill-add-btn {
  background: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  font-family: "EB Garamond", serif;
  font-size: 17px;
  padding: 2px 10px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
}
.quill-add-btn:hover {
  background: var(--ink);
  color: var(--paper);
}

.scratch-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 48px;
  padding: 4px;
  border-radius: 2px;
  background: rgba(120, 80, 20, 0.04);
}

.scratch-card {
  background: #fdf8eb;
  border: 1px solid rgba(122, 102, 72, 0.4);
  padding: 8px 10px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: grab;
  box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.08);
  transition: transform 0.15s, box-shadow 0.15s;
  user-select: none;
}
.scratch-card:hover {
  transform: translateY(-1px);
  box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.12);
  border-color: var(--seal);
}
.drag-handle {
  color: var(--faint);
  font-size: 16px;
  line-height: 1;
}
.scratch-card .title {
  flex: 1;
  font-family: "Caveat", cursive;
  font-size: 21px;
  color: var(--pen-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.scratch-del {
  background: none;
  border: 0;
  color: var(--faint);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.scratch-del:hover {
  color: var(--seal);
}

/* Wax Seal & Evening */
.seal {
  display: none;
  margin-top: 14px;
  color: var(--seal);
  font: 21px "IM Fell English", serif;
  border: 3px double var(--seal);
  padding: 6px 18px;
  width: fit-content;
  transform: rotate(-3deg);
  border-radius: 40px;
  background: rgba(140, 43, 34, 0.07);
  box-shadow: 1px 2px 6px rgba(140, 43, 34, 0.2);
}
.seal.on { display: inline-block; }

.early-reflect-btn {
  background: none;
  border: 0;
  border-bottom: 1px dashed var(--faint);
  color: var(--faint);
  font-size: 14px;
  font-style: italic;
  cursor: pointer;
  padding: 0;
  margin-top: 8px;
}
.early-reflect-btn:hover { color: var(--seal); border-color: var(--seal); }

/* Right Column: Scrollable Timeline Tracker */
.timeline-section {
  display: flex;
  flex-direction: column;
}

.timeline-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--faint-line);
}
.timeline-title {
  font-family: "IM Fell English", serif;
  font-size: 22px;
  margin: 0;
  color: var(--ink);
}
.timeline-subtitle {
  font-size: 14px;
  font-style: italic;
  color: var(--faint);
  margin-left: 6px;
}
.timeline-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.pill-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid var(--ink);
  color: var(--ink);
  font-family: "EB Garamond", serif;
  font-size: 15px;
  font-style: italic;
  padding: 4px 12px;
  cursor: pointer;
  border-radius: 14px;
  transition: all 0.15s;
}
.pill-btn:hover {
  background: var(--ink);
  color: var(--paper);
}

/* Scrollable Timeline Ledger Container */
.timeline-ledger {
  border: 2px solid var(--ink);
  background: rgba(255, 255, 255, 0.12);
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Franklin Authentic Time Block with Hour Strip */
.franklin-block {
  display: grid;
  grid-template-columns: 78px 1fr;
  border-bottom: 2px solid var(--ink);
  background: #fdfaf2;
  position: relative;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}
.franklin-block:last-child {
  border-bottom: 0;
}
.franklin-block.drag-over {
  background: var(--drop-target) !important;
  outline: 2px dashed var(--seal);
  outline-offset: -3px;
}
.franklin-block.dragging {
  opacity: 0.45;
}

/* Left Hour Column within the Block */
.block-hours {
  border-right: 2px solid var(--ink);
  background: rgba(246, 237, 214, 0.45);
  display: flex;
  flex-direction: column;
}
.hour-cell {
  flex: 1;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font: italic 24px "EB Garamond", serif;
  color: var(--ink);
  border-bottom: 1px solid rgba(122, 102, 72, 0.4);
  position: relative;
  user-select: none;
}
.hour-cell:last-child {
  border-bottom: 0;
}
.hour-cell small {
  font-size: 11px;
  font-style: normal;
  color: var(--faint);
  margin-left: 2px;
}
.hour-cell.is-now {
  background: var(--now);
  color: var(--seal);
  font-weight: 700;
  box-shadow: inset 4px 0 0 var(--seal);
}
.hour-cell.is-now::before {
  content: "\2192";
  position: absolute;
  left: 3px;
  font-size: 14px;
  color: var(--seal);
  font-weight: bold;
}

/* Right Content Area (The Bracketed Page Content) */
.block-content {
  padding: 10px 14px 12px 16px;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Bracket Header */
.block-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.block-grip {
  cursor: grab;
  color: var(--faint);
  font-size: 17px;
  line-height: 1;
  padding: 2px 4px;
  user-select: none;
}
.block-grip:active {
  cursor: grabbing;
}

.block-title-input {
  flex: 1;
  font: 600 20px "EB Garamond", serif;
  background: transparent;
  border: 0;
  color: var(--ink);
  padding: 0;
  margin: 0;
  border-bottom: 1px solid transparent;
}
.block-title-input:focus {
  outline: none;
  border-bottom: 1px dashed var(--ink);
}

/* Allowed Durations: Strictly 2, 3, 4 Hours Only */
.dur-selector {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--ink);
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.4);
}
.dur-opt {
  background: none;
  border: 0;
  border-right: 1px solid var(--ink);
  font: italic 13px "EB Garamond", serif;
  color: var(--ink);
  padding: 2px 7px;
  cursor: pointer;
  line-height: 1.2;
  transition: all 0.15s;
}
.dur-opt:last-child {
  border-right: 0;
}
.dur-opt[data-active="true"] {
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
}
.dur-opt:hover:not([data-active="true"]) {
  background: rgba(140, 43, 34, 0.1);
  color: var(--seal);
}

/* Done Checkmark Button */
.tick-btn {
  background: none;
  border: 2px solid var(--ink);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 15px;
  cursor: pointer;
  color: var(--ink);
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  margin-left: 4px;
}
.franklin-block.done .tick-btn {
  background: var(--ink);
  color: var(--paper);
}
.tick-btn:hover {
  border-color: var(--seal);
  color: var(--seal);
}
.franklin-block.done .tick-btn:hover {
  background: var(--seal);
  color: var(--paper);
}

/* Done Strikethrough */
.franklin-block.done .block-title-input,
.franklin-block.done .block-textarea,
.franklin-block.done .task-item {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  text-decoration-color: var(--seal);
  opacity: 0.65;
}

/* Textarea / Notes */
.block-textarea {
  width: 100%;
  background: transparent;
  border: 0;
  resize: vertical;
  min-height: 48px;
  padding: 4px 0 0 4px;
  font-family: "Caveat", cursive;
  font-size: 22px;
  color: var(--pen-ink);
  line-height: 1.35;
}
.block-textarea:focus {
  outline: none;
}
.block-textarea::placeholder {
  color: #a49474;
}

/* Dropped Tasks List inside Block */
.block-tasks {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
  padding-left: 4px;
}
.task-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "Caveat", cursive;
  font-size: 21px;
  color: var(--pen-ink);
  background: rgba(255, 255, 255, 0.4);
  padding: 2px 8px;
  border-radius: 2px;
  border-left: 2px solid var(--seal);
}
.task-bullet {
  font-size: 14px;
  color: var(--seal);
}
.task-del-btn {
  background: none;
  border: 0;
  color: var(--faint);
  font-size: 16px;
  cursor: pointer;
  margin-left: auto;
  line-height: 1;
}
.task-del-btn:hover {
  color: var(--seal);
}

/* Block Drop Hint */
.drop-zone-hint {
  font-size: 13px;
  font-style: italic;
  color: var(--faint);
  margin-top: 4px;
  opacity: 0.7;
}

/* Block 6: Sleep */
.sleep-block {
  display: grid;
  grid-template-columns: 78px 1fr;
  background: rgba(0, 0, 0, 0.06);
  border-top: 2px solid var(--ink);
}
.sleep-hours {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 2px solid var(--ink);
  font: italic 22px "EB Garamond", serif;
  color: var(--faint);
  padding: 18px 0;
  text-align: center;
  line-height: 1.2;
}
.sleep-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 16px 20px;
}
.sleep-title {
  font-family: "IM Fell English", serif;
  font-style: italic;
  font-size: 24px;
  color: var(--ink);
  margin-bottom: 2px;
}
.sleep-sub {
  font-size: 16px;
  font-style: italic;
  color: var(--faint);
}

/* Footer */
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
  border-top: 2px solid var(--ink);
  padding-top: 14px;
  font-style: italic;
}
.foot-actions {
  display: flex;
  gap: 16px;
}
.foot-btn {
  background: none;
  border: 0;
  border-bottom: 1px solid var(--faint);
  font: italic 17px "EB Garamond", serif;
  color: var(--ink);
  cursor: pointer;
  padding: 0;
  transition: color 0.15s;
}
.foot-btn:hover {
  color: var(--seal);
  border-color: var(--seal);
}
.progress-stat {
  font-family: "IM Fell English", serif;
  font-size: 19px;
  color: var(--ink);
}

[hidden] { display: none !important; }

@media (max-width: 600px) {
  body { padding: 12px 6px 30px; }
  .page { padding: 20px 14px 28px; }
  .head h1 { font-size: 26px; }
  .block-hours { width: 68px; }
}
</style>
</head>
<body>

<main class="page" id="app" role="main"></main>

<script>
(function() {
  var STORAGE_KEY = "franklin_six_blocks_v3";

  var SAYINGS = [
    "Diligence is the mother of good luck.",
    "Early to bed and early to rise, makes a man healthy, wealthy, and wise.",
    "Lost time is never found again.",
    "Well done is better than well said.",
    "He that can have patience can have what he will.",
    "Drive thy business, let not that drive thee.",
    "Employ thy time well, if thou meanest to gain leisure.",
    "One today is worth two tomorrows.",
    "Energy and persistence conquer all things.",
    "An investment in knowledge pays the best interest.",
    "Be at war with your vices, at peace with your neighbours, and let every new year find you a better man.",
    "Little strokes fell great oaks.",
    "Beware of little expenses; a small leak will sink a great ship.",
    "Plough deep, while sluggards sleep, and you shall have corn to sell and to keep.",
    "By failing to prepare, you are preparing to fail."
  ];

  /* 
    Franklin's Canonical Six Time Blocks:
    1. 5:00 AM – 8:00 AM (3 hours): Rise, wash, address Powerful Goodness, plan day, study, breakfast
    2. 8:00 AM – 12:00 PM (4 hours): Deep work & labor
    3. 12:00 PM – 2:00 PM (2 hours): Read, overlook accounts, dine
    4. 2:00 PM – 6:00 PM (4 hours): Deep work & labor
    5. 6:00 PM – 10:00 PM (4 hours): Put things in places, supper, diversion, examination of the day
    6. 10:00 PM – 5:00 AM (7 hours): Sleep
  */
  var CANONICAL_BLOCKS = [
    {
      id: "b1",
      duration: 3, // allowed: 2, 3, 4
      title: "Rise, wash, and address Powerful Goodness",
      text: "Contrive day's business, and take the resolution of the day; prosecute the present study, and breakfast.",
      tasks: [],
      done: false
    },
    {
      id: "b2",
      duration: 4, // allowed: 2, 3, 4
      title: "Work — Morning Diligence",
      text: "Deep work, focus on essential ventures without diversion.",
      tasks: [],
      done: false
    },
    {
      id: "b3",
      duration: 2, // allowed: 2, 3, 4
      title: "Read, or overlook my accounts, and dine",
      text: "Examine ledgers, converse with temperance, repast.",
      tasks: [],
      done: false
    },
    {
      id: "b4",
      duration: 4, // allowed: 2, 3, 4
      title: "Work — Afternoon Endeavours",
      text: "Printing, correspondence, trade and industrious labor.",
      tasks: [],
      done: false
    },
    {
      id: "b5",
      duration: 4, // allowed: 2, 3, 4
      title: "Put things in their places; supper, diversion & examination",
      text: "Order the shop and chamber; supper, music or conversation; examination of the day.",
      tasks: [],
      done: false
    }
  ];

  var app = document.getElementById("app");
  var draggedItem = null;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveState(s) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch (e) {}
  }

  function formatHour(h) {
    var mod = ((h % 24) + 24) % 24;
    var a = mod < 12 ? "am" : "pm";
    var n = mod % 12 || 12;
    return { n: n, a: a, raw: mod };
  }

  function ord(n) {
    var s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function getDateInfo() {
    var d = new Date();
    var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var mo = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var startOfYear = new Date(d.getFullYear(), 0, 0);
    var doy = Math.floor((d - startOfYear) / 864e5);
    var saying = SAYINGS[doy % SAYINGS.length];
    return {
      line: days[d.getDay()] + ", " + ord(d.getDate()) + " " + mo[d.getMonth()] + " " + d.getFullYear(),
      page: doy,
      saying: saying
    };
  }

  function esc(s) {
    return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  var state = loadState();
  if (!state || state.date !== todayKey()) {
    state = {
      date: todayKey(),
      riseHour: 5,
      morning: "Resolve to act with diligence and justice in all things.",
      evening: "",
      sealed: false,
      scratchpad: [
        { id: "s1", text: "Draft letter to Peter Collinson" },
        { id: "s2", text: "Audit print shop ledger" },
        { id: "s3", text: "Walk by the river & fresh air" }
      ],
      blocks: CANONICAL_BLOCKS
    };
    saveState(state);
  }

  function renderHeader() {
    var d = getDateInfo();
    return '<div class="head">' +
      '<div class="head-ornament">\u25c6 \u25c6 \u25c6</div>' +
      '<h1>The Daily Page</h1>' +
      '<p class="subtitle">' + d.line + ' \u2014 page ' + d.page + ' of the year</p>' +
      '<p class="saying">\u201c' + d.saying + '\u201d</p>' +
    '</div>';
  }

  /* 
    Calculate start hours dynamically based on block durations (only 2, 3, or 4 hours).
  */
  function computeBlockHours() {
    var cur = state.riseHour; // starts at 5:00 AM
    return state.blocks.map(function(b) {
      var start = cur;
      var dur = [2, 3, 4].indexOf(b.duration) !== -1 ? b.duration : 3;
      var hoursList = [];
      for (var k = 0; k < dur; k++) {
        hoursList.push((start + k) % 24);
      }
      cur = (start + dur) % 24;
      return {
        block: b,
        startHour: start,
        endHour: cur,
        hours: hoursList
      };
    });
  }

  function showDay() {
    var computed = computeBlockHours();
    var currentHour = new Date().getHours();
    var doneCount = state.blocks.filter(function(b) { return b.done; }).length;
    var totalCount = state.blocks.length;

    // Render Blocks 1-5 (2h, 3h, 4h only)
    var blocksHtml = computed.map(function(item, idx) {
      var b = item.block;
      var startObj = formatHour(item.startHour);
      var endObj = formatHour(item.endHour);

      var hourCells = item.hours.map(function(h) {
        var o = formatHour(h);
        var isNow = (h === currentHour);
        return '<div class="hour-cell' + (isNow ? ' is-now' : '') + '">' +
          o.n + '<small>' + o.a + '</small>' +
          '</div>';
      }).join("");

      var tasksHtml = (b.tasks || []).map(function(t, tIdx) {
        return '<div class="task-item">' +
          '<span class="task-bullet">\u2014</span>' +
          '<span>' + esc(t.text) + '</span>' +
          '<button type="button" class="task-del-btn" data-del-task="' + idx + ',' + tIdx + '">\u00d7</button>' +
          '</div>';
      }).join("");

      return '<div class="franklin-block' + (b.done ? ' done' : '') + '" draggable="true" data-block-idx="' + idx + '" data-block-id="' + b.id + '">' +
        '<div class="block-hours">' +
          hourCells +
        '</div>' +
        '<div class="block-content">' +
          '<div class="block-header">' +
            '<span class="block-grip" title="Drag to reorder block">\u22ee\u22ee</span>' +
            '<input class="block-title-input" value="' + esc(b.title) + '" data-field="title" aria-label="Block title">' +
            '<div class="dur-selector" title="Duration: strictly 2h, 3h, or 4h">' +
              '<button type="button" class="dur-opt" data-set-dur="2" data-active="' + (b.duration === 2) + '">2h</button>' +
              '<button type="button" class="dur-opt" data-set-dur="3" data-active="' + (b.duration === 3) + '">3h</button>' +
              '<button type="button" class="dur-opt" data-set-dur="4" data-active="' + (b.duration === 4) + '">4h</button>' +
            '</div>' +
            '<button type="button" class="tick-btn" data-action="toggle-done" title="Mark completed">\u2713</button>' +
          '</div>' +
          '<textarea class="block-textarea" rows="2" data-field="text" placeholder="Write plans, projects or thoughts for these hours\u2026">' + esc(b.text) + '</textarea>' +
          (tasksHtml ? '<div class="block-tasks">' + tasksHtml + '</div>' : '') +
          '<div class="drop-zone-hint">\u2193 Drop intentions from Quill Scratchpad into this block</div>' +
        '</div>' +
      '</div>';
    }).join("");

    // Block 6: Sleep (10:00 PM – 5:00 AM, 7 hours)
    var sleepHtml = '<div class="sleep-block">' +
      '<div class="sleep-hours">' +
        '<div>10<small>pm</small></div>' +
        '<div style="font-size:14px; color:var(--faint); margin:2px 0;">\u2193 7h</div>' +
        '<div>5<small>am</small></div>' +
      '</div>' +
      '<div class="sleep-content">' +
        '<div class="sleep-title">VI. Sleep</div>' +
        '<div class="sleep-sub">\u201cSleep, wholesome and uninterrupted.\u201d</div>' +
      '</div>' +
    '</div>';

    // Quill Scratchpad items
    var scratchHtml = state.scratchpad.map(function(s) {
      return '<div class="scratch-card" draggable="true" data-scratch-id="' + s.id + '">' +
        '<span class="drag-handle">\u22ee\u22ee</span>' +
        '<span class="title">' + esc(s.text) + '</span>' +
        '<button type="button" class="scratch-del" title="Remove" data-del-scratch="' + s.id + '">\u00d7</button>' +
        '</div>';
    }).join("");

    var eveningUnlocked = state.forceEvening || (currentHour >= 18 || currentHour < 5);

    var pageHtml = renderHeader() +
      '<div class="layout">' +
        /* Sidebar */
        '<div class="sidebar">' +
          '<div class="card-box">' +
            '<h2 class="q">The Morning Question</h2>' +
            '<p class="q-sub">What good shall I do this day?</p>' +
            '<textarea class="ans" id="morningInput" rows="2" maxlength="160" placeholder="Today I will\u2026">' + esc(state.morning) + '</textarea>' +
          '</div>' +

          /* Quill Scratchpad */
          '<div class="scratchpad card-box">' +
            '<div class="scratchpad-header">' +
              '<h3>Quill Scratchpad</h3>' +
              '<span class="scratchpad-hint">Drag into any block</span>' +
            '</div>' +
            '<div class="scratch-input-row">' +
              '<input type="text" class="scratch-input" id="newScratchText" placeholder="Jot an intention\u2026" maxlength="80">' +
              '<button type="button" class="quill-add-btn" id="addScratchBtn">Jot</button>' +
            '</div>' +
            '<div class="scratch-list" id="scratchList">' +
              (scratchHtml || '<div style="font-size:14px; font-style:italic; color:var(--faint); padding:8px 4px;">No unslotted tasks. Jot above and drag into any block!</div>') +
            '</div>' +
          '</div>' +

          /* Evening Reflection */
          '<div class="card-box">' +
            '<h2 class="q">The Evening Question</h2>' +
            '<p class="q-sub">What good have I done today?</p>' +
            '<textarea class="ans" id="eveningInput" rows="3" maxlength="200" ' +
              (eveningUnlocked ? '' : 'disabled ') +
              'placeholder="' + (eveningUnlocked ? 'Tonight I examined and accomplished\u2026' : 'Opens in the evening block (6:00 PM)') + '">' +
              esc(state.evening) +
            '</textarea>' +
            (!eveningUnlocked ? '<button type="button" class="early-reflect-btn" id="unlockEveningBtn">Reflect earlier</button>' : '') +
            '<div class="seal' + (state.sealed ? ' on' : '') + '" id="sealBadge">Page complete \u2022 1726</div>' +
          '</div>' +
        '</div>' +

        /* Timeline Section with The Six Time Blocks */
        '<div class="timeline-section">' +
          '<div class="timeline-toolbar">' +
            '<div>' +
              '<h2 class="timeline-title">The Six Time Blocks</h2>' +
              '<span class="timeline-subtitle">Franklin\u2019s 24-Hour System (3h, 4h, 2h, 4h, 4h & 7h Sleep)</span>' +
            '</div>' +
            '<div class="timeline-actions">' +
              '<button type="button" class="pill-btn" id="resetDefaultsBtn">Reset to Franklin 1726</button>' +
            '</div>' +
          '</div>' +

          '<div class="timeline-ledger" id="timelineLedger">' +
            blocksHtml +
            sleepHtml +
          '</div>' +
        '</div>' +
      '</div>' +

      /* Footer */
      '<div class="foot">' +
        '<span class="progress-stat" id="progressStat">' + doneCount + ' of ' + totalCount + ' blocks fulfilled</span>' +
        '<div class="foot-actions">' +
          '<button type="button" class="foot-btn" id="printBtn">Print Journal</button>' +
          '<button type="button" class="foot-btn" id="clearBtn">Clear Tasks</button>' +
        '</div>' +
      '</div>';

    app.innerHTML = pageHtml;

    wireEvents();
  }

  function wireEvents() {
    // Morning & Evening
    var morningInput = document.getElementById("morningInput");
    if (morningInput) {
      morningInput.addEventListener("input", function(e) {
        state.morning = e.target.value;
        saveState(state);
      });
    }

    var eveningInput = document.getElementById("eveningInput");
    if (eveningInput) {
      eveningInput.addEventListener("input", function(e) {
        state.evening = e.target.value;
        state.sealed = e.target.value.trim().length > 0;
        var sealBadge = document.getElementById("sealBadge");
        if (sealBadge) sealBadge.classList.toggle("on", state.sealed);
        saveState(state);
      });
    }

    var unlockEveningBtn = document.getElementById("unlockEveningBtn");
    if (unlockEveningBtn) {
      unlockEveningBtn.addEventListener("click", function() {
        state.forceEvening = true;
        saveState(state);
        showDay();
      });
    }

    // Quill Scratchpad add
    var addScratchBtn = document.getElementById("addScratchBtn");
    var newScratchText = document.getElementById("newScratchText");
    function addScratch() {
      var val = (newScratchText.value || "").trim();
      if (!val) return;
      state.scratchpad.push({ id: "s_" + Date.now(), text: val });
      newScratchText.value = "";
      saveState(state);
      showDay();
    }
    if (addScratchBtn && newScratchText) {
      addScratchBtn.addEventListener("click", addScratch);
      newScratchText.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          addScratch();
        }
      });
    }

    // Scratch delete
    document.querySelectorAll("[data-del-scratch]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.dataset.delScratch;
        state.scratchpad = state.scratchpad.filter(function(s) { return s.id !== id; });
        saveState(state);
        showDay();
      });
    });

    // Delete task from block
    document.querySelectorAll("[data-del-task]").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var parts = btn.dataset.delTask.split(",");
        var bIdx = +parts[0];
        var tIdx = +parts[1];
        if (state.blocks[bIdx] && state.blocks[bIdx].tasks) {
          state.blocks[bIdx].tasks.splice(tIdx, 1);
          saveState(state);
          showDay();
        }
      });
    });

    // Reset defaults button
    var resetDefaultsBtn = document.getElementById("resetDefaultsBtn");
    if (resetDefaultsBtn) {
      resetDefaultsBtn.addEventListener("click", function() {
        if (confirm("Reset blocks to Franklin's original 1726 scheme (3h, 4h, 2h, 4h, 4h)?")) {
          state.blocks = JSON.parse(JSON.stringify(CANONICAL_BLOCKS));
          saveState(state);
          showDay();
        }
      });
    }

    // Print & Clear
    var printBtn = document.getElementById("printBtn");
    if (printBtn) {
      printBtn.addEventListener("click", function() { window.print(); });
    }
    var clearBtn = document.getElementById("clearBtn");
    if (clearBtn) {
      clearBtn.addEventListener("click", function() {
        if (confirm("Clear notes and tasks from all blocks?")) {
          state.blocks.forEach(function(b) {
            b.text = "";
            b.tasks = [];
            b.done = false;
          });
          state.evening = "";
          state.sealed = false;
          saveState(state);
          showDay();
        }
      });
    }

    // Block Inputs & Controls
    document.querySelectorAll(".franklin-block").forEach(function(blockEl) {
      var idx = +blockEl.dataset.blockIdx;
      var bObj = state.blocks[idx];
      if (!bObj) return;

      var titleInput = blockEl.querySelector(".block-title-input");
      if (titleInput) {
        titleInput.addEventListener("input", function(e) {
          bObj.title = e.target.value;
          saveState(state);
        });
      }

      var textarea = blockEl.querySelector(".block-textarea");
      if (textarea) {
        textarea.addEventListener("input", function(e) {
          bObj.text = e.target.value;
          saveState(state);
        });
      }

      // Duration buttons: STRICTLY 2, 3, 4 HOURS ONLY
      blockEl.querySelectorAll("[data-set-dur]").forEach(function(durBtn) {
        durBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          var durVal = parseInt(durBtn.dataset.setDur, 10);
          if (durVal === 2 || durVal === 3 || durVal === 4) {
            bObj.duration = durVal;
            saveState(state);
            showDay();
          }
        });
      });

      // Done checkmark toggle
      var tickBtn = blockEl.querySelector('[data-action="toggle-done"]');
      if (tickBtn) {
        tickBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          bObj.done = !bObj.done;
          saveState(state);
          showDay();
        });
      }

      // Block Drag to reorder
      blockEl.addEventListener("dragstart", function(e) {
        draggedItem = { type: "block", index: idx, id: bObj.id };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", bObj.title);
        setTimeout(function() { blockEl.classList.add("dragging"); }, 0);
      });
      blockEl.addEventListener("dragend", function() {
        blockEl.classList.remove("dragging");
        clearAllDragOver();
        draggedItem = null;
      });

      // Drop target on Block (accepts reordered block or scratchpad card!)
      blockEl.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        blockEl.classList.add("drag-over");
      });
      blockEl.addEventListener("dragleave", function(e) {
        if (!blockEl.contains(e.relatedTarget)) {
          blockEl.classList.remove("drag-over");
        }
      });
      blockEl.addEventListener("drop", function(e) {
        e.preventDefault();
        blockEl.classList.remove("drag-over");
        if (!draggedItem) return;

        if (draggedItem.type === "scratch") {
          // Add scratchpad task to this block!
          var sId = draggedItem.id;
          var scratchObj = state.scratchpad.find(function(s) { return s.id === sId; });
          if (scratchObj) {
            if (!bObj.tasks) bObj.tasks = [];
            bObj.tasks.push({ text: scratchObj.text });
            state.scratchpad = state.scratchpad.filter(function(s) { return s.id !== sId; });
            saveState(state);
            showDay();
          }
        } else if (draggedItem.type === "block") {
          // Reorder blocks!
          var fromIdx = draggedItem.index;
          var toIdx = idx;
          if (fromIdx !== toIdx) {
            var moved = state.blocks.splice(fromIdx, 1)[0];
            state.blocks.splice(toIdx, 0, moved);
            saveState(state);
            showDay();
          }
        }
        draggedItem = null;
      });
    });

    // Scratch card drag
    document.querySelectorAll(".scratch-card").forEach(function(card) {
      card.addEventListener("dragstart", function(e) {
        var id = card.dataset.scratchId;
        var item = state.scratchpad.find(function(s) { return s.id === id; });
        draggedItem = { type: "scratch", id: id, data: item };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", item ? item.text : "Task");
        card.style.opacity = "0.4";
      });
      card.addEventListener("dragend", function() {
        card.style.opacity = "1";
        clearAllDragOver();
        draggedItem = null;
      });
    });
  }

  function clearAllDragOver() {
    document.querySelectorAll(".franklin-block").forEach(function(b) {
      b.classList.remove("drag-over");
    });
  }

  showDay();
})();
</script>
</body>
</html>
